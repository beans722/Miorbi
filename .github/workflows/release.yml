name: Build and publish beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'Packaging/Info.plist'
      - 'docs/0.1.1-beta.1.md'

permissions:
  contents: write

concurrency:
  group: miorbi-beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --disable-sandbox
      - name: Package both architectures
        shell: zsh {0}
        run: |
          MIORBI_ARCH=arm64 zsh Packaging/build-dmg.sh
          MIORBI_ARCH=x86_64 zsh Packaging/build-dmg.sh
          hdiutil verify dist/Miorbi-0.1.1-beta.1-arm64.dmg
          hdiutil verify dist/Miorbi-0.1.1-beta.1-x86_64.dmg
          cd dist
          shasum -a 256 Miorbi-0.1.1-beta.1-arm64.dmg Miorbi-0.1.1-beta.1-x86_64.dmg > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.1.1-beta.1
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Miorbi-0.1.1-beta.1-arm64.dmg dist/Miorbi-0.1.1-beta.1-x86_64.dmg dist/SHA256SUMS.txt --clobber
            gh release edit "$tag" --notes-file docs/0.1.1-beta.1.md --prerelease
          else
            gh release create "$tag" dist/Miorbi-0.1.1-beta.1-arm64.dmg dist/Miorbi-0.1.1-beta.1-x86_64.dmg dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Miorbi 0.1.1 Beta 1 — Lyric Focus' --notes-file docs/0.1.1-beta.1.md --prerelease
          fi
